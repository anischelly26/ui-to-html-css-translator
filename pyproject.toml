[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "form-vision-studio"
version = "2.0.0"
description = "An inspectable, local-first screenshot-to-code studio."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<0.4",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<5",
  "tinycss2>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
form-studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
