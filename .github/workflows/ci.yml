name: Studio checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: pip install -r requirements.lock && pip install --no-deps -e . && pip install 'pytest>=8,<10' 'ruff>=0.11,<1'
      - run: ruff check studio tests config.py main.py element_detector.py image_processor.py html_generator.py
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npm audit --audit-level=high
  browser-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build the production container
        run: docker build -t form-studio:test .
      - name: Start and verify the unprivileged service
        run: |
          docker run --detach --name form-studio-ci --publish 127.0.0.1:8000:8000 --env FORM_API_KEY=ci-fixture-key form-studio:test
          test "$(docker exec form-studio-ci id -u)" = "10001"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs form-studio-ci
          exit 1
      - name: Verify the complete studio workflow
        working-directory: web
        env:
          FORM_TEST_BASE_URL: http://127.0.0.1:8000
          FORM_TEST_KEY: ci-fixture-key
        run: npm run test:e2e
      - name: Container logs
        if: always()
        run: docker logs form-studio-ci || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: studio-browser-evidence
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
